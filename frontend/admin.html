<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saanye CRM — Admin Metas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { background: var(--bg-root); align-items: center; justify-content: center; }
    .admin-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.05);
    }
    .header { margin-bottom: 24px; text-align: center; }
    .header h1 { font-size: 1.5rem; color: var(--text-primary); }
    .header p { color: var(--text-muted); font-size: 0.9rem; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-md);
      border-radius: var(--radius-sm);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
    }
    .form-control:focus { outline: none; border-color: var(--brand); }
    
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: all .2s;
    }
    .btn:hover { background: var(--brand-light); }
    
    .vendedora-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .vendedora-name { flex: 1; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .vendedora-meta { width: 180px; }
    
    #login-section { display: block; }
    #metas-section { display: none; }
  </style>
</head>
<body>

  <div class="admin-container" id="login-section">
    <div class="header">
      <h1>Acceso Administrativo</h1>
      <p>Ingrese el PIN para gestionar las metas mensuales.</p>
    </div>
    <div class="form-group">
      <label>PIN de Acceso</label>
      <input type="password" id="admin-pin" class="form-control" placeholder="****" />
    </div>
    <button class="btn" id="btn-login">Ingresar</button>
  </div>

  <div class="admin-container" id="metas-section">
    <div class="header">
      <h1>Metas por Vendedora</h1>
      <p>Defina la meta mensual en pesos (ej. 50000000 para 50 MM)</p>
    </div>
    <div id="metas-list">
      <!-- Generado dinámicamente -->
    </div>
    <div class="form-group" style="margin-top:24px;">
      <button class="btn" id="btn-save">Guardar Metas</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/static/admin.js"></script>
</body>
</html>
