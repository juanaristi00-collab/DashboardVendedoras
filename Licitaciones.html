function ViabilidadBadge({ score }) {
  const color = score >= 75 ? '#27AE60' : score >= 50 ? '#EC672D' : '#EB5757';
  const label = score >= 75 ? 'Alta' : score >= 50 ? 'Media' : 'Baja';
  // Arc params
  const r = 11, cx = 14, cy = 14, stroke = 2.5;
  const circ = 2 * Math.PI * r;
  const dash = (score / 100) * circ;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 7, background: `${color}14`, border: `1px solid ${color}33`, borderRadius: 8, padding: '5px 10px 5px 6px' }}>
      <svg width="28" height="28" viewBox="0 0 28 28">
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={stroke} />
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
          transform={`rotate(-90 ${cx} ${cy})`} style={{ transition: 'stroke-dasharray 0.4s ease' }} />
        <text x={cx} y={cy + 4} textAnchor="middle" fontSize="8" fontWeight="800" fill={color} fontFamily="'Plus Jakarta Sans',sans-serif">{score}</text>
      </svg>
      <div>
        <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: `${color}bb`, lineHeight: 1 }}>Viabilidad</div>
        <div style={{ fontSize: 12, fontWeight: 800, color, lineHeight: 1.3 }}>{label}</div>
      </div>
    </div>
  );
}

function diasRestantes(fecha) {
  const diff = new Date(fecha) - new Date();
  return Math.max(0, Math.ceil(diff / 86400000));
}

function formatCOP(val) { return val; }

// ── Detail Modal ──────────────────────────────────────────────
function DetailModal({ licitacion, onClose, tweaks }) {

                  onMouseLeave={e => { if (!item.active) e.currentTarget.style.color = 'rgba(32,46,56,0.55)'; }}>
                  {item.label}
                  {item.badge && <span style={{ background: accent, color: '#fff', borderRadius: 20, fontSize: 10, fontWeight: 800, padding: '1px 7px', lineHeight: '18px' }}>{item.badge}</span>}
                </a>
              ))}
            </div>
          </div>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
            <button style={{ background: 'transparent', border: '1.5px solid rgba(32,46,56,0.3)', color: '#202E38', borderRadius: 10, padding: '7px 18px', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Ingresar</button>
            <button style={{ background: '#EC672D', border: 'none', color: '#fff', borderRadius: 10, padding: '8px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>Registrarse</button>
          </div>
        </div>
      </nav>

      {/* ── HERO ── */}
      {tweaks.showHero && (
        <div style={{ background: '#E5E4D4', position: 'relative', overflow: 'hidden', paddingBottom: 56 }}>
          {/* Gradient orbs */}
          <div style={{ position: 'absolute', top: -60, right: -80, width: 400, height: 400, borderRadius: '50%', background: `radial-gradient(circle, ${accent}55 0%, transparent 70%)`, pointerEvents: 'none' }} />
          <div style={{ position: 'absolute', bottom: -100, left: -60, width: 300, height: 300, borderRadius: '50%', background: `radial-gradient(circle, #B3C9CC33 0%, transparent 70%)`, pointerEvents: 'none' }} />

          <div style={{ maxWidth: 1200, margin: '0 auto', padding: '56px 24px 0' }}>
            <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 40, flexWrap: 'wrap' }}>
              <div style={{ maxWidth: 560 }}>
                <span style={{ display: 'inline-block', background: 'rgba(236,103,45,0.12)', color: '#EC672D', borderRadius: 8, padding: '4px 12px', fontSize: 12, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 16 }}>Plataforma de Compras Públicas</span>
                <h1 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 'clamp(40px, 6vw, 68px)', color: '#fff', lineHeight: 1.0, marginBottom: 18, letterSpacing: '0.01em' }}>
                  <span style={{ color: '#202E38' }}>Licitaciones</span><br />
                  <span style={{ color: '#EC672D' }}>Públicas </span>
                  <span style={{ color: '#202E38' }}>Colombia</span>
                </h1>
                <p style={{ fontSize: 16, color: 'rgba(32,46,56,0.65)', lineHeight: 1.7, maxWidth: 440, marginBottom: 0 }}>
                  Encuentra y participa en los procesos de contratación pública más relevantes del país, en un solo lugar.
                </p>
              </div>

              <div style={{ display: 'flex', gap: 48, flexWrap: 'wrap' }}>
                <StatBadge label="Licitaciones activas" value={abiertas} accent={accent} />
                <StatBadge label="Próximas a cerrar" value={proximas} accent="#224F55" />
                <StatBadge label="Entidades vinculadas" value="142" accent="#202E38" />
              </div>
            </div>
          </div>

          {/* Search bar */}
          <div style={{ maxWidth: 1200, margin: '40px auto 0', padding: '0 24px' }}>
            <div style={{ background: '#fff', borderRadius: 16, padding: '6px 8px 6px 20px', display: 'flex', alignItems: 'center', gap: 12, boxShadow: '0 8px 32px rgba(0,0,0,0.12)' }}>
              <span style={{ color: '#9AAAB0', fontSize: 18, flexShrink: 0 }}>🔍</span>
              <input value={search} onChange={e => setSearch(e.target.value)}
                placeholder="Buscar por entidad, sector, objeto contractual…"
                style={{ flex: 1, border: 'none', outline: 'none', fontSize: 15, color: '#202E38', background: 'transparent', fontFamily: "'Plus Jakarta Sans', sans-serif" }} />
              <button style={{ background: accent, color: '#fff', border: 'none', borderRadius: 12, padding: '12px 28px', fontSize: 14, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap' }}>Buscar</button>
            </div>
          </div>
        </div>
      )}

      {/* ── CONTENT ── */}
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '40px 24px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '240px 1fr', gap: 28, alignItems: 'start' }}>

          {/* ── SIDEBAR FILTERS ── */}
          <aside style={{ background: '#FDFCF8', borderRadius: 16, padding: '24px', border: '1.5px solid #DDD9CC', position: 'sticky', top: 80 }}>
            <h3 style={{ fontSize: 13, fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#9AAAB0', marginBottom: 20 }}>Filtros</h3>

            <div style={{ marginBottom: 24 }}>
              <p style={{ fontSize: 13, fontWeight: 700, color: '#202E38', marginBottom: 12 }}>Estado del proceso</p>
              {ESTADOS.map(e => (
                <label key={e} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 9, cursor: 'pointer' }}>
                  <div onClick={() => setEstado(e)} style={{ width: 18, height: 18, borderRadius: 5, border: `2px solid ${estado === e ? accent : '#C8C4B8'}`, background: estado === e ? accent : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s', flexShrink: 0 }}>
                    {estado === e && <span style={{ color: '#fff', fontSize: 10, fontWeight: 800 }}>✓</span>}
                  </div>
                  <span style={{ fontSize: 14, color: estado === e ? '#202E38' : '#5A6A73', fontWeight: estado === e ? 700 : 500 }}>{e === 'Todos' ? 'Todos' : estadoLabel[e]}</span>
                </label>
              ))}
            </div>

            <div>
              <p style={{ fontSize: 13, fontWeight: 700, color: '#202E38', marginBottom: 12 }}>Categoría</p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                {CATEGORIAS.map(c => (
                  <button key={c} onClick={() => setCategoria(c)}
                    style={{ textAlign: 'left', padding: '8px 12px', borderRadius: 9, border: 'none', background: categoria === c ? `${teal}15` : 'transparent', color: categoria === c ? teal : '#5A6A73', fontWeight: categoria === c ? 700 : 500, fontSize: 14, cursor: 'pointer', transition: 'all 0.15s', fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
                    {c !== 'Todas' && <span style={{ marginRight: 8 }}>{catIcon[c]}</span>}{c}
                  </button>
                ))}
              </div>
            </div>

            {(categoria !== 'Todas' || estado !== 'Todos' || search !== '') && (
              <button onClick={() => { setCategoria('Todas'); setEstado('Todos'); setSearch(''); }}
                style={{ width: '100%', marginTop: 20, padding: '10px', background: 'transparent', border: `1.5px solid #DDD9CC`, borderRadius: 10, color: '#7A8A93', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>
                Limpiar filtros
              </button>
            )}
          </aside>

          {/* ── RESULTS ── */}
          <main>
            {/* Results header */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
              <div>
                <h2 style={{ fontSize: 22, fontWeight: 800, color: '#202E38' }}>
                  {categoria !== 'Todas' ? categoria : 'Todos los procesos'}
                </h2>
                <p style={{ fontSize: 14, color: '#7A8A93', marginTop: 2 }}>{filtered.length} proceso{filtered.length !== 1 ? 's' : ''} encontrado{filtered.length !== 1 ? 's' : ''}</p>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <select style={{ border: '1.5px solid #DDD9CC', borderRadius: 10, padding: '8px 14px', fontSize: 13, color: '#202E38', background: '#fff', cursor: 'pointer', fontFamily: "'Plus Jakarta Sans', sans-serif", outline: 'none' }}>
                  <option>Más recientes</option>
                  <option>Mayor valor</option>
                  <option>Cierre próximo</option>
                </select>
              </div>
            </div>

            {/* Cards */}
            {filtered.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '60px 20px', color: '#9AAAB0' }}>
                <div style={{ fontSize: 48, marginBottom: 16 }}>🔍</div>
                <p style={{ fontSize: 18, fontWeight: 700, color: '#5A6A73' }}>Sin resultados</p>
                <p style={{ fontSize: 14, marginTop: 6 }}>Intenta con otros términos o ajusta los filtros</p>
              </div>
            ) : (
              <div style={{ display: 'grid', gap: tweaks.density === 'compact' ? 10 : 14 }}>
                {filtered.map(l => <LicitacionCard key={l.id} licitacion={l} onClick={setSelected} tweaks={tweaks} />)}
              </div>
            )}

            {/* Pagination stub */}
            {filtered.length > 0 && (
              <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginTop: 36 }}>
                {[1,2,3,'…',12].map((p, i) => (
                  <button key={i} style={{ width: 38, height: 38, borderRadius: 10, border: `1.5px solid ${i === 0 ? accent : '#DDD9CC'}`, background: i === 0 ? accent : '#fff', color: i === 0 ? '#fff' : '#5A6A73', fontWeight: 700, fontSize: 14, cursor: 'pointer', fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
                    {p}
                  </button>
                ))}
              </div>
            )}
          </main>
        </div>
      </div>

      {/* ── FOOTER ── */}
      <footer style={{ background: '#202E38', marginTop: 60, padding: '40px 24px' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 20 }}>
          <div>
            <Logo height={28} orange={true} />
            <p style={{ fontSize: 13, color: '#7A8A93' }}>Plataforma de compras públicas · Colombia 2026</p>
          </div>
          <div style={{ display: 'flex', gap: 24 }}>
            {['Términos', 'Privacidad', 'Contacto', 'API'].map(l => (
              <a key={l} href="#" style={{ fontSize: 13, color: '#7A8A93', textDecoration: 'none' }}>{l}</a>
            ))}
          </div>
        </div>
      </footer>

      {/* ── MODAL ── */}
      {selected && <DetailModal licitacion={selected} onClose={() => setSelected(null)} tweaks={tweaks} />}

      {/* ── TWEAKS PANEL ── */}
      <TweaksPanel>
        <TweakSection title="Colores">
          <TweakColor id="accentColor" label="Color acento (naranja)" />
          <TweakColor id="tealColor" label="Color primario (teal)" />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakToggle id="showHero" label="Mostrar hero" />
          <TweakRadio id="density" label="Densidad de cards" options={["normal", "compact"]} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
